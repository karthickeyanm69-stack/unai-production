<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SamruddiSave — Redirecting...</title>
    <script>
      // Single Page Application static host refresh fallback
      var path = window.location.pathname;
      if (path && path !== '/') {
        window.location.replace('/#' + path);
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to SamruddiSave Platform...</p>
  </body>
</html>
